name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: maris-test/reusable-workflows/.github/workflows/pull-request-policy.yml@476c0d10f194e8d5470c6e3c9cb20b79697e6a21
    with:
      policy-ref: 476c0d10f194e8d5470c6e3c9cb20b79697e6a21
      required-checks: '["ci / validate-translations"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval