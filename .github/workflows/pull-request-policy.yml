name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: maris-test/reusable-workflows/.github/workflows/pull-request-policy.yml@545e16f7e144ee38136b99d0165e9e01a5a27cb1
    with:
      policy-ref: 545e16f7e144ee38136b99d0165e9e01a5a27cb1
      required-checks: '["ci / validate-translations", "ci / build"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval