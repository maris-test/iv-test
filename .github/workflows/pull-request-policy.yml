name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: maris-test/reusable-workflows/.github/workflows/pull-request-policy.yml@42445f52994f2b79e77c84068c2d8fc8d8a4fe60
    with:
      policy-ref: 42445f52994f2b79e77c84068c2d8fc8d8a4fe60
      required-checks: '["ci / validate-translations", "ci / build"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval