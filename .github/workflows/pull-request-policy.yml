name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: maris-test/reusable-workflows/.github/workflows/pull-request-policy.yml@13568c46a18aa1cdb9b69d505113ec987b71a5c2
    with:
      policy-ref: 13568c46a18aa1cdb9b69d505113ec987b71a5c2
      required-checks: '["ci / validate-translations", "ci / build"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval